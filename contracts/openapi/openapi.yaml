                correlationId: corr_display_role_01
    ClassroomCommandValidationResponse:
      description: >-
        The Classroom Session command path or request body fails structural
        validation. Only DIRECT_ACTION with action NEXT is supported.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidClassroomSessionId:
              summary: Classroom Session identifier is structurally invalid
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: One or more request fields are invalid.
                code: REQUEST_VALIDATION_FAILED
                correlationId: corr_command_validation_01
                fieldErrors:
                  - field: classroomSessionId
                    code: INVALID_VALUE
                    message: The field value does not satisfy its contract.
            missingCommandId:
              summary: commandId is missing
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: One or more request fields are invalid.
                code: REQUEST_VALIDATION_FAILED
                correlationId: corr_command_validation_02
                fieldErrors:
                  - field: commandId
                    code: REQUIRED
                    message: The field is required.
            missingExpectedRevision:
              summary: expectedRevision is missing
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: One or more request fields are invalid.
                code: REQUEST_VALIDATION_FAILED
                correlationId: corr_command_validation_03
                fieldErrors:
                  - field: expectedRevision
                    code: REQUIRED
                    message: The field is required.
            invalidExpectedRevision:
              summary: expectedRevision is structurally invalid
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: One or more request fields are invalid.
                code: REQUEST_VALIDATION_FAILED
                correlationId: corr_command_validation_04
                fieldErrors:
                  - field: expectedRevision
                    code: INVALID_VALUE
                    message: The field value does not satisfy its contract.
            unsupportedCommandType:
              summary: Only the DIRECT_ACTION command class is supported
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: One or more request fields are invalid.
                code: REQUEST_VALIDATION_FAILED
                correlationId: corr_command_validation_05
                fieldErrors:
                  - field: commandType
                    code: UNSUPPORTED_VALUE
                    message: The field value is not supported by this contract.
            unsupportedAction:
              summary: Only the NEXT direct action is supported
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: One or more request fields are invalid.
                code: REQUEST_VALIDATION_FAILED
                correlationId: corr_command_validation_06
                fieldErrors:
                  - field: action
                    code: UNSUPPORTED_VALUE
                    message: The field value is not supported by this contract.
    ClassroomCommandForbiddenResponse:
      description: >-
        The request lacks valid CSRF material or active TEACHER_CONTROLLER
        participant authority for the path Classroom Session. The response does
        not disclose participant identity, role-slot ownership, another
        Classroom Session, or another Teacher.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            csrfRejected:
              summary: Missing or invalid CSRF material
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: The request did not include valid CSRF protection.
                code: CSRF_REJECTED
                correlationId: corr_command_csrf_01
            controllerAuthorityRequired:
              summary: Controller participant authority is missing or invalid
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Active Controller authority is required for this request.
                code: CONTROLLER_AUTHORITY_REQUIRED
                correlationId: corr_command_authority_01
            displayParticipantRejected:
              summary: A Display participant cannot issue Teacher commands
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Active Controller authority is required for this request.
                code: CONTROLLER_AUTHORITY_REQUIRED
                correlationId: corr_command_authority_02
    ClassroomCommandConflictResponse:
      description: >-
        Current authoritative command identity, revision, or mutation state
        conflicts with the request. No new mutation occurs. STALE_REVISION does
        not include currentRevision because authoritative snapshot and
        reconciliation state remain owned by the later snapshot contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            staleRevision:
              summary: An unseen command was based on a stale revision
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The command revision does not match authoritative state.
                code: STALE_REVISION
                correlationId: corr_command_stale_01
            commandIdReuseConflict:
              summary: An accepted CommandId was reused for a different request
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The command identity was reused for a different command.
                code: COMMAND_ID_REUSE_CONFLICT
                correlationId: corr_command_reuse_01
            classroomMutationNotAllowed:
              summary: Current authoritative state does not permit a new NEXT
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The classroom session does not currently permit mutation.
                code: CLASSROOM_MUTATION_NOT_ALLOWED
                correlationId: corr_command_state_01
