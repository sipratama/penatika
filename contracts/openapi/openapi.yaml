    ClassroomCommandConflictResponse:
      description: >-
        Current authoritative command identity, revision, or mutation state
        conflicts with the request. No new mutation occurs. STALE_REVISION does
        not include currentRevision or a projection in Problem Details;
        reconciliation uses the Controller-authorized controller-state read
        before a new command is created. This contract does not grant
        Controller participants access to the classroom-safe Display snapshot
        or Display SSE projection. Under the current closed command schema,
        COMMAND_ID_REUSE_CONFLICT is reachable when an accepted CommandId is
        reused with a different expectedRevision; unsupported commandType or
        action values remain REQUEST_VALIDATION_FAILED.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            staleRevision:
              summary: An unseen command was based on a stale revision
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The command revision does not match authoritative state.
                code: STALE_REVISION
                correlationId: corr_command_stale_01
            commandIdReuseConflict:
              summary: >-
                An accepted CommandId was reused with another expectedRevision
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The command identity was reused for a different command.
                code: COMMAND_ID_REUSE_CONFLICT
                correlationId: corr_command_reuse_01
            classroomMutationNotAllowed:
              summary: Current authoritative state does not permit a new NEXT
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The classroom session does not currently permit mutation.
                code: CLASSROOM_MUTATION_NOT_ALLOWED
                correlationId: corr_command_state_01
