            code: CLASSROOM_SESSION_NOT_FOUND
            correlationId: corr_classroom_lookup_01
    PairingGrantIssuanceConflictResponse:
      description: >-
        Current authoritative Classroom Session state prevents grant issuance,
        or an active participant already occupies the requested role. Existing
        participants are never silently replaced.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            sessionNotPairable:
              summary: Current Classroom Session state does not permit pairing
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The classroom session does not currently permit pairing.
                code: CLASSROOM_SESSION_NOT_PAIRABLE
                correlationId: corr_pairing_state_01
            controllerAlreadyActive:
              summary: Teacher Controller role is already occupied
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: An active participant already occupies the requested role.
                code: PARTICIPANT_ROLE_ALREADY_ACTIVE
                correlationId: corr_pairing_role_01
            displayAlreadyActive:
              summary: Classroom Display role is already occupied
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: An active participant already occupies the requested role.
                code: PARTICIPANT_ROLE_ALREADY_ACTIVE
                correlationId: corr_pairing_role_02
    PairingGrantRejectedResponse:
      description: >-
        The supplied PairingGrant cannot establish the requested participant.
        Unknown, expired, consumed, revoked, replayed, wrong-role, ended-session,
        and otherwise invalid grants share this non-disclosing outcome.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidGrant:
              summary: Unknown or otherwise invalid grant
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: The pairing grant cannot authorize this request.
                code: PAIRING_GRANT_REJECTED
                correlationId: corr_pairing_rejected_01
            expiredGrant:
              summary: Expired grant uses the same non-disclosing outcome
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: The pairing grant cannot authorize this request.
                code: PAIRING_GRANT_REJECTED
                correlationId: corr_pairing_rejected_02
            replayedGrant:
              summary: Consumed or replayed grant uses the same outcome
              value:
